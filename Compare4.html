<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookshelf</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link rel="stylesheet" href="Compare2.css">
</head>
<body>
  <div class="navbar">
    <a href="Compare.html">Home</a>
    <a href="Compare4.html">My Bookshelf</a>
  </div>

  <h1>My Bookshelf</h1>

  <div id="bookshelf-container"></div>

  <script>
    $(document).ready(function() {
      const bookshelfId = 'YOUR_PUBLIC_BOOKSHELF_ID'; // Replace with your public bookshelf ID
      fetchBookshelf(bookshelfId);

      function fetchBookshelf(bookshelfId) {
        const apiUrl = `https://www.googleapis.com/books/v1/mylibrary/bookshelves/${bookshelfId}/volumes`;

        $.get(apiUrl, function(data) {
          const books = data.items || [];
          displayBooks(books);
        });
      }

      function displayBooks(books) {
        $("#bookshelf-container").empty();
        books.forEach(function(book) {
          const title = book.volumeInfo.title;
          const authors = book.volumeInfo.authors ? book.volumeInfo.authors.join(", ") : "Unknown Author";
          const thumbnail = book.volumeInfo.imageLinks ? book.volumeInfo.imageLinks.thumbnail : "https://via.placeholder.com/128x193?text=No+Image";
          const bookId = book.id;
          const bookDetailsLink = `book-details.html?id=${bookId}`;

          const bookElement = `
            <div class="book" data-id="${bookId}">
              <a href="${bookDetailsLink}">
                <img src="${thumbnail}" alt="${title}">
                <h3>${title}</h3>
              </a>
              <p>${authors}</p>
            </div>
          `;

          $("#bookshelf-container").append(bookElement);
        });
      }
    });
  </script>
</body>
</html>
