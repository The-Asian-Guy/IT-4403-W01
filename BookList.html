<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Milestone 1: Book Search Results</title>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    .parentContainer {
      text-align: center;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #FFC629;
      margin: 0;
      padding: 0;
      color: #FFC629;
    }

    h1 {
      text-align: center;
      color: black;
    }

    .book-list {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      padding: 20px;
    }

    .book-item {
      width: 250px;
      background-color: black;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      transition: transform 0.3s;
    }

    .book-item:hover {
      transform: scale(1.05);
    }

    .book-image img {
      width: 100%;
      max-width: 180px;
      height: auto;
      border-radius: 4px;
    }

    .book-info h3 {
      color: #FFC629;
    }

    .book-info p {
      font-size: 0.9em;
      color: #b0b3b2;
      line-height: 1.4;
    }

    .book-info a {
      background-color: black;
      color: #FFC629;
      border-radius: 8px;
      border: 2px solid #FFC629;
      padding: 10px 15px;
      text-align: center;
      margin: 5px;
      text-decoration: none;
      display: inline-block;
    }

    .book-info a:hover {
      background-color: #b0b3b2;
      color: black;
    }

    .error-message {
      color: black;
      text-align: center;
      font-size: 1.2em;
      padding: 20px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Milestone 1: Book Search Results</h1>

    <div class="parentContainer">
      <a href="IndividualProjectWork.html">
        Return to Individual Project Works
      </a>
    </div>

    <div class="book-list" id="book-list"></div>

  </div>

  <script>

    /*
     * This function returns a value if it exists.
     * If the value is missing, it returns "Not available".
     */
    function getValue(value) {

      if (value === undefined || value === null || value === "") {
        return "Not available";
      }

      return value;
    }


    /*
     * This function handles fields that contain arrays.
     * Example:
     * ["Peter Gasston"]
     * becomes:
     * Peter Gasston
     */
    function getArrayValue(array) {

      if (!array || array.length === 0) {
        return "Not available";
      }

      return array.join(", ");
    }


    /*
     * Load the local Open Library JSON file.
     */
    $(document).ready(function() {

      $.getJSON("openlibrary-search.json")

        .done(function(data) {

          var books = data.docs;

          var bookList = $("#book-list");


          /*
           * Make sure the JSON contains books.
           */
          if (!books || books.length === 0) {

            bookList.html(
              '<p class="error-message">No books were found.</p>'
            );

            return;
          }


          /*
           * Loop through every book in the docs array.
           */
          $.each(books, function(index, book) {

            /*
             * Get the cover image.
             *
             * Open Library provides cover images using
             * the cover_i or cover_edition_key values.
             */
            var coverImage = "";

            if (book.cover_i) {

              coverImage =
                "https://covers.openlibrary.org/b/id/" +
                book.cover_i +
                "-M.jpg";

            } else if (book.cover_edition_key) {

              coverImage =
                "https://covers.openlibrary.org/b/olid/" +
                book.cover_edition_key +
                "-M.jpg";

            }


            /*
             * If there is no cover image, use a placeholder.
             */
            if (coverImage === "") {

              coverImage =
                "https://via.placeholder.com/180x260?text=No+Cover";

            }


            /*
             * Create the Open Library work URL.
             *
             * The "key" field normally contains something like:
             * /works/OL16804365W
             */
            var openLibraryLink = "#";

            if (book.key) {

              openLibraryLink =
                "https://openlibrary.org" +
                book.key;

            }


            /*
             * Get the authors.
             */
            var authors = getArrayValue(book.author_name);


            /*
             * Get publishers.
             */
            var publishers = getArrayValue(book.publisher);


            /*
             * Get ISBN numbers.
             */
            var isbn = getArrayValue(book.isbn);


            /*
             * Get subjects.
             */
            var subjects = getArrayValue(book.subject);


            /*
             * Get languages.
             */
            var languages = getArrayValue(book.language);


            /*
             * Get publication years.
             */
            var publicationYears =
              getArrayValue(book.publish_year);


            /*
             * Get publication dates.
             */
            var publicationDates =
              getArrayValue(book.publish_date);


            /*
             * Create the HTML for this book.
             */
            var bookItem = `

              <div class="book-item">

                <div class="book-image">

                  <img
                    src="${coverImage}"
                    alt="${getValue(book.title)}"
                    onerror="this.src='https://via.placeholder.com/180x260?text=No+Cover';"
                  >

                </div>


                <div class="book-info">

                  <h3>
                    ${getValue(book.title)}
                  </h3>


                  <p>
                    <strong>Authors:</strong>
                    ${authors}
                  </p>


                  <p>
                    <strong>First Publication Year:</strong>
                    ${getValue(book.first_publish_year)}
                  </p>


                  <p>
                    <strong>Publisher:</strong>
                    ${publishers}
                  </p>


                  <p>
                    <strong>Edition Count:</strong>
                    ${getValue(book.edition_count)}
                  </p>


                  <p>
                    <strong>ISBN:</strong>
                    ${isbn}
                  </p>


                  <p>
                    <strong>Publication Years:</strong>
                    ${publicationYears}
                  </p>


                  <p>
                    <strong>Publication Dates:</strong>
                    ${publicationDates}
                  </p>


                  <p>
                    <strong>Language:</strong>
                    ${languages}
                  </p>


                  <p>
                    <strong>Subjects:</strong>
                    ${subjects}
                  </p>


                  <p>
                    <strong>Ebook Count:</strong>
                    ${getValue(book.ebook_count_i)}
                  </p>


                  <p>
                    <strong>Full Text Available:</strong>
                    ${book.has_fulltext ? "Yes" : "No"}
                  </p>


                  <a
                    href="${openLibraryLink}"
                    target="_blank"
                  >
                    Open Library
                  </a>

                </div>

              </div>

            `;


            /*
             * Add the book to the page.
             */
            bookList.append(bookItem);

          });

        })


        /*
         * If the JSON file cannot be loaded,
         * display an error message.
         */
        .fail(function(jqXHR, textStatus, errorThrown) {

          console.log("Error loading openlibrary-search.json");
          console.log("Status:", textStatus);
          console.log("Error:", errorThrown);

          $("#book-list").html(`

            <p class="error-message">
              Unable to load the book data.
              <br><br>
              Make sure that
              <strong>openlibrary-search.json</strong>
              is in the same folder as
              <strong>BookList.html</strong>.
            </p>

          `);

        });

    });

  </script>

</body>
</html>
