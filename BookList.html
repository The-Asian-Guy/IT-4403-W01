<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milestone 1: Book Search Results</title>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    .parentContainer {
      text-align: center;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #FFC629;
      margin: 0;
      padding: 0;
      color: #FFC629;
    }

    h1 {
      text-align: center;
      color: black;
    }

    .book-list {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .book-item {
      width: 250px;
      background-color: black;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      transition: transform 0.3s;
    }

    .book-item:hover {
      transform: scale(1.05);
    }

    .book-image img {
      width: 100%;
      max-width: 180px;
      height: auto;
      border-radius: 4px;
    }

    .book-info h3 {
      color: #FFC629;
    }

    .book-info p {
      font-size: 0.9em;
      color: #b0b3b2;
    }

    a:link,
    a:visited {
      background-color: black;
      color: #FFC629;
      border-radius: 8px;
      border: 2px solid #FFC629;
      padding: 14px 25px;
      text-align: center;
      margin: 0 auto;
      text-decoration: none;
      display: inline-block;
    }

    a:hover,
    a:active {
      background-color: #b0b3b2;
      color: black;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Milestone 1: Book Search Results</h1>

    <div class="parentContainer">
      <a href="IndividualProjectWork.html">
        Return to Individual Project Works
      </a>
    </div>

    <div class="book-list" id="book-list"></div>

  </div>

  <script>

    $(document).ready(function() {

      /*
       * Load the Open Library JSON file.
       *
       * Make sure openlibrary-search.json is
       * in the same folder as this HTML file.
       */
      $.getJSON("openlibrary-search.json", function(data) {

        var books = data.docs;

        var bookList = $("#book-list");

        /*
         * Check to make sure the docs array
         * contains books.
         */
        if (!books || books.length === 0) {

          bookList.html(
            "<p style='color:black;'>" +
            "No books were found." +
            "</p>"
          );

          return;
        }

        /*
         * Loop through the docs array.
         */
        $.each(books, function(index, book) {

          /*
           * Title
           */
          var title = book.title || "Not available";


          /*
           * Authors
           */
          var authors = "Not available";

          if (book.author_name) {
            authors = book.author_name.join(", ");
          }


          /*
           * First publication year
           */
          var year = "Not available";

          if (book.first_publish_year) {
            year = book.first_publish_year;
          }


          /*
           * Publisher
           */
          var publisher = "Not available";

          if (book.publisher) {
            publisher = book.publisher.join(", ");
          }


          /*
           * Edition count
           */
          var editionCount = "Not available";

          if (book.edition_count) {
            editionCount = book.edition_count;
          }


          /*
           * ISBN
           */
          var isbn = "Not available";

          if (book.isbn) {

            isbn = book.isbn
              .slice(0, 3)
              .join(", ");

          }


          /*
           * Language
           */
          var language = "Not available";

          if (book.language) {
            language = book.language.join(", ");
          }


          /*
           * Number of pages
           */
          var pages = "Not available";

          if (book.number_of_pages_median) {
            pages = book.number_of_pages_median;
          }


          /*
           * Subjects
           */
          var subjects = "Not available";

          if (book.subject) {

            subjects = book.subject
              .slice(0, 5)
              .join(", ");

          }


          /*
           * Cover image
           */
          var coverHTML = "";

          if (book.cover_i) {

            var coverURL =
              "https://covers.openlibrary.org/b/id/" +
              book.cover_i +
              "-M.jpg";

            coverHTML =
              "<div class='book-image'>" +
                "<img src='" +
                coverURL +
                "' alt='Cover of " +
                title +
                "'>" +
              "</div>";

          }


          /*
           * Open Library link
           */
          var openLibraryLink =
            "https://openlibrary.org" +
            (book.key || "");


          /*
           * Subtitle
           */
          var subtitleHTML = "";

          if (book.subtitle) {

            subtitleHTML =
              "<p>" +
                "<strong>Subtitle:</strong> " +
                book.subtitle +
              "</p>";

          }


          /*
           * Create the book card.
           */
          var bookItem =

            "<div class='book-item'>" +

              coverHTML +

              "<div class='book-info'>" +

                "<h3>" +
                  title +
                "</h3>" +

                subtitleHTML +

                "<p>" +
                  "<strong>Authors:</strong> " +
                  authors +
                "</p>" +

                "<p>" +
                  "<strong>First Published:</strong> " +
                  year +
                "</p>" +

                "<p>" +
                  "<strong>Publisher:</strong> " +
                  publisher +
                "</p>" +

                "<p>" +
                  "<strong>Edition Count:</strong> " +
                  editionCount +
                "</p>" +

                "<p>" +
                  "<strong>ISBN:</strong> " +
                  isbn +
                "</p>" +

                "<p>" +
                  "<strong>Language:</strong> " +
                  language +
                "</p>" +

                "<p>" +
                  "<strong>Pages:</strong> " +
                  pages +
                "</p>" +

                "<p>" +
                  "<strong>Subjects:</strong> " +
                  subjects +
                "</p>" +

                "<a href='" +
                  openLibraryLink +
                  "' target='_blank'>" +
                  "View on Open Library" +
                "</a>" +

              "</div>" +

            "</div>";


          /*
           * Add the book card to the page.
           */
          bookList.append(bookItem);

        });

      }).fail(function(xhr, status, error) {

        console.log("Error:", error);
        console.log("Status:", status);
        console.log("Response:", xhr.responseText);

        $("#book-list").html(
          "<p style='color:black;'>" +
          "Unable to load openlibrary-search.json." +
          "<br><br>" +
          "Make sure the JSON file is in the same " +
          "folder as BookList.html." +
          "</p>"
        );

      });

    });

  </script>

</body>
</html>
