<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Milestone 1: Book Search Results</title>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    .parentContainer {
      text-align: center;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #FFC629;
      margin: 0;
      padding: 0;
      color: #FFC629;
    }

    h1 {
      text-align: center;
      color: black;
    }

    .book-list {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      padding: 20px;
    }

    .book-item {
      width: 250px;
      background-color: black;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      transition: transform 0.3s;
    }

    .book-item:hover {
      transform: scale(1.05);
    }

    .book-image img {
      width: 100%;
      max-width: 180px;
      height: auto;
      border-radius: 4px;
    }

    .book-info h3 {
      color: #FFC629;
    }

    .book-info p {
      font-size: 0.9em;
      color: #b0b3b2;
      line-height: 1.4;
    }

    .book-info a,
      .page-button {
        background-color: black;
        color: #FFC629;
        border-radius: 8px;
        border: 2px solid #FFC629;
        padding: 10px 15px;
        text-align: center;
        margin: 5px;
        text-decoration: none;
        display: inline-block;
      }

      .book-info a:hover,
      .page-button:hover {
        background-color: #b0b3b2;
        color: black;
      }


    .error-message {
      color: black;
      text-align: center;
      font-size: 1.2em;
      padding: 20px;
    }
    .placeholder-cover {
      width: 180px;
      height: 260px;
      margin: 0 auto;
      background-color: #b0b3b2;
      color: black;
      border: 2px solid #FFC629;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: bold;
      font-size: 1.1em;
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>Milestone 1: Book Search Results</h1>

    <div class="parentContainer">
      <a class="page-button" href="IndividualProjectWork.html">
        Return to Individual Project Works
      </a>
    </div>

    <div class="book-list" id="book-list"></div>

  </div>

  <script>

    function getValue(value) {

      if (value === undefined || value === null || value === "") {
        return "Not available";
      }

      return value;
    }

    function getArrayValue(array) {

      if (!array || array.length === 0) {
        return "Not available";
      }

      return array.join(", ");
    }

    $(document).ready(function() {

      $.getJSON("openlibrary-search.json")

        .done(function(data) {

          var books = data.docs;

          var bookList = $("#book-list");

          if (!books || books.length === 0) {

            bookList.html(
              '<p class="error-message">No books were found.</p>'
            );

            return;
          }

          $.each(books, function(index, book) {

            var coverImage = "";

            if (book.cover_i) {
              coverHTML = `
                <img
                  src="https://covers.openlibrary.org/b/id/${book.cover_i}-M.jpg"
                  alt="${getValue(book.title)}"
                  onerror="this.parentElement.innerHTML='<div class=&quot;placeholder-cover&quot;>No Cover<br>Available</div>';"
                >
              `;

            } else if (book.cover_edition_key) {

              coverHTML = `
                <img
                  src="https://covers.openlibrary.org/b/olid/${book.cover_edition_key}-M.jpg"
                  alt="${getValue(book.title)}"
                  onerror="this.parentElement.innerHTML='<div class=&quot;placeholder-cover&quot;>No Cover<br>Available</div>';"
                >
              `;

            } else {

              coverHTML = `
                <div class="placeholder-cover">
                  No Cover<br>
                  Available
                </div>
              `;

            }

            if (coverImage === "") {

              coverImage =
                "https://via.placeholder.com/180x260?text=No+Cover";

            }
            
            var openLibraryLink = "#";

            if (book.key) {

              openLibraryLink =
                "https://openlibrary.org" +
                book.key;

            }

            var authors = getArrayValue(book.author_name);

            var publishers = getArrayValue(book.publisher);

            var isbn = getArrayValue(book.isbn);

            var subjects = getArrayValue(book.subject);

            var languages = getArrayValue(book.language);

            var publicationYears =
              getArrayValue(book.publish_year);

            var publicationDates =
              getArrayValue(book.publish_date);
            
            var bookItem = `
              <div class="book-item">
                <div class="book-image">
                  ${coverHTML}
                </div>
                
                <div class="book-info">
                  <h3>
                    ${getValue(book.title)}
                  </h3>
                  
                  <p>
                    <strong>Authors:</strong>
                    ${authors}
                  </p>


                  <p>
                    <strong>First Publication Year:</strong>
                    ${getValue(book.first_publish_year)}
                  </p>


                  <p>
                    <strong>Publisher:</strong>
                    ${publishers}
                  </p>


                  <p>
                    <strong>Edition Count:</strong>
                    ${getValue(book.edition_count)}
                  </p>


                  <p>
                    <strong>ISBN:</strong>
                    ${isbn}
                  </p>


                  <p>
                    <strong>Publication Years:</strong>
                    ${publicationYears}
                  </p>


                  <p>
                    <strong>Publication Dates:</strong>
                    ${publicationDates}
                  </p>


                  <p>
                    <strong>Language:</strong>
                    ${languages}
                  </p>


                  <p>
                    <strong>Subjects:</strong>
                    ${subjects}
                  </p>


                  <p>
                    <strong>Ebook Count:</strong>
                    ${getValue(book.ebook_count_i)}
                  </p>


                  <p>
                    <strong>Full Text Available:</strong>
                    ${book.has_fulltext ? "Yes" : "No"}
                  </p>


                  <a
                    href="${openLibraryLink}"
                    target="_blank"
                  >
                    Open Library
                  </a>

                </div>

              </div>

            `;
            bookList.append(bookItem);

          });

        })
        .fail(function(jqXHR, textStatus, errorThrown) {

          console.log("Error loading openlibrary-search.json");
          console.log("Status:", textStatus);
          console.log("Error:", errorThrown);

          $("#book-list").html(`

            <p class="error-message">
              Unable to load the book data.
            </p>

          `);

        });

    });

  </script>

</body>
</html>
